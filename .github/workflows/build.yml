name: build

# The gate on main. release.yml still owns publishing (it only runs on a v* tag); this one
# answers a narrower question on every pull request and every push to main: does it compile,
# and do the three version literals still agree?
#
# They are independent on purpose and drift silently: `VERSION` in the Makefile feeds the
# bundle's Info.plist, `displaykeepVersion` in DisplayKeep.swift is what the binary reports,
# and the newest CHANGELOG.md heading is what the tag becomes. release.yml only ever checks
# the bundle, so a bump that misses one of the others would ship and stay green.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: build
        run: make build

      - name: version literals agree
        run: |
          want=$(make -s version)
          makefile=$want
          swift=$(sed -n 's/^let displaykeepVersion = "\(.*\)"$/\1/p' DisplayKeep.swift)
          newest=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$newest" ]; then # older bare "## 1.3" headings
            newest=$(sed -n 's/^## \([0-9][^ ]*\).*/\1/p' CHANGELOG.md | head -1)
          fi

          printf 'Makefile VERSION        %s\n' "$makefile"
          printf 'DisplayKeep.swift       %s\n' "$swift"
          printf 'CHANGELOG.md (newest)   %s\n' "$newest"

          failed=0
          [ "$swift" = "$want" ] || {
            echo "::error file=DisplayKeep.swift::displaykeepVersion is '$swift', Makefile says '$want'"
            failed=1
          }
          [ "$newest" = "$want" ] || {
            echo "::error file=CHANGELOG.md::newest section is '$newest', Makefile says '$want'"
            failed=1
          }
          exit $failed

      - name: changelog has a section for that version
        run: scripts/release-notes.sh "$(make -s version)" > /dev/null

      - name: bundle carries that version, an icon and a valid signature
        run: |
          app=.build/DisplayKeep.app
          want=$(make -s version)
          got=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          if [ "$got" != "$want" ]; then
            echo "::error::bundle version $got does not match Makefile VERSION $want"
            exit 1
          fi
          # the icon is generated, so a broken make-icon.swift shows up as a bundle that
          # builds and signs but has nothing for Finder to draw
          icon=$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")
          if [ ! -s "$app/Contents/Resources/$icon.icns" ]; then
            echo "::error::$app/Contents/Resources/$icon.icns is missing or empty"
            exit 1
          fi
          codesign --verify --deep --strict "$app"
